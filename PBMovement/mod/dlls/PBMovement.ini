; ============================================================================
; PBMovement.ini - settings for the Project Borealis movement graft
;
; Place this file next to main.dll in …/mod/PBMovementCpp/dlls/.
; Changes take effect after restarting the game. Missing settings use the
; defaults shown here.
;
; Distances use Unreal units (about 100 UU = 1 meter). Speeds are UU/s and
; acceleration values are UU/s². Setting names are not case-sensitive.
; Section names are only for organization. Lines beginning with ';' or '#'
; are comments.
; ============================================================================

[General]
; Enables the movement graft. Set to false to leave VotV movement untouched
; without uninstalling the mod.
EnableGraft = true

[Speeds]
RunSpeed            = 361.9     ; normal movement speed
SprintSpeed         = 609.6     ; speed while holding VotV's run input
WalkSpeed           = 285.75    ; slow-walk speed
CrouchSpeedFraction = 0.3333333 ; crouch speed as a fraction of RunSpeed
; Heavy carry is derived separately: preserve vanilla's 150/400 = 37.5% of
; RUN net drive after PB braking. Defaults resolve to 183.3375 uu/s instead of
; the 120.633 crouch gait, giving constrained props enough player traction.

[Acceleration]
MaxAcceleration              = 857.25 ; maximum ground acceleration
GroundAccelerationMultiplier = 10.0   ; ground acceleration strength
AirAccelerationMultiplier    = 10.0   ; air-strafing acceleration strength
AirSpeedCap                  = 57.15  ; air acceleration speed cap
AirSlideSpeedCap             = 57.15  ; air acceleration cap while sliding
AirControl                   = 1.0    ; air control strength

[Jump]
JumpZVelocity = 304.8 ; jump strength
AutoBunnyhop  = true  ; hold jump to jump again immediately after landing

[ABH]
; Enables Source Orange Box-style jump acceleration, including ABH, AFH and ASH.
; This is an optional addition and is not part of standard Project Borealis
; movement.
;
; To ABH: build forward speed, turn around in the air, release the movement keys,
; and jump again as you land. Crouching produces the strongest acceleration.
; At high speed, hold S for AFH or S+A/D for ASH.
;
; This also adds Source's forward-jump speed bonus. Set to false for pure PB
; jumping.
EnableABH = true

; Discards the jump bonus when applying it along the view direction would
; reduce speed. ABH, AFH and ASH are unaffected. Set false for Source behavior.
JumpBonusNeverSlows = true

[Water]
; Uses HL2-style movement while swimming. Set to false to use the normal grafted
; air movement in water.
EnableWaterMove = true

; Swimming speed as a fraction of your normal movement speed.
WaterSpeedFraction = 0.8

; Additional speed multiplier when you do not have scuba air.
; 0.75 keeps the penalty moderate; 0.5 matches VotV's original ratio.
WaterNoScubaScale = 0.75

; Water resistance. Higher values slow you more quickly.
WaterFriction = 4.0

; true  = swim whenever the water reaches your waist, even with feet on the floor
; false = walk whenever your feet are touching the floor, matching vanilla VotV
; Shallow water always uses normal walking.
SwimWhenWaistDeep = true

; Allows rivers to push the player downstream.
EnableWaterCurrent = true

; River-current strength. Lower values weaken it; 0 disables it.
WaterCurrentScale = 1.0

[Braking]
; Ground friction strength. Higher values stop you faster but can make movement,
; especially crouched movement, feel sluggish.
BrakingFriction       = 4.0
BrakingFrictionFactor = 1.0

; Minimum speed used when calculating ground friction. Raising this increases
; low-speed stopping force. Excessive values can prevent crouched acceleration,
; so unsafe values are clamped and reported in the UE4SS log.
BrakingDecelerationWalking = 190.5

; Briefly preserves momentum when landing during a bunnyhop.
BrakingWindow = 0.015

; How quickly ground movement turns toward your input without losing speed.
; 8 matches VotV's normal grip; 0 gives pure HL2-style drifting.
; This does not affect air-strafing, bunnyhop landings or preserved excess speed.
GroundTurnFriction = 8.0

[Music]
; Plays your own WAV, MP3 or FLAC after building speed. Put the file next to
; main.dll or use a full path. Leave empty to disable. Requires EnableGraft.
File =

; Horizontal speed thresholds. Separate values prevent rapid on/off switching.
SpeedOn  = 800.0
SpeedOff = 650.0

Volume = 0.7  ; 0..1; in-game volume sliders still apply
FadeIn  = 0.75 ; seconds
FadeOut = 1.5  ; seconds
Loop    = true

; true starts from the beginning each time; false resumes after a brief slowdown.
RestartEachTime = false

[EdgeFriction]
; Adds braking near ledges to reduce accidental sliding.
; Set EdgeFrictionMultiplier to 1.0 to disable the feature.
EdgeFrictionMultiplier = 2.0
EdgeFrictionHeight     = 64.77 ; how far below the player to check
EdgeFrictionDist       = 30.48 ; how far ahead of the player to check

; true = check only while braking
; false = check whenever the player is grounded
EdgeFrictionOnlyWhenBraking = false

[Surf]
; Controls extra bounce when clipping against slopes. Landing rejection and
; surf-floor detection are handled automatically.
BounceMultiplier = 0.0 ; 0 disables extra bounce

[Slope]
; At high speed, the movement system lowers step height and becomes stricter
; about walkable slopes. This helps the player follow ramps and quarter-pipes.
MinStepHeight          = 10.0
StepDownHeightFraction = 0.9
SpeedMultMin           = 1036.32 ; effect begins at this speed
SpeedMultMax           = 1524.0  ; effect reaches full strength at this speed

[Misc]
; Maximum velocity on each individual axis.
AxisSpeedLimit = 6667.5

; Maximum movement substep in seconds. 1/33 avoids frame-rate-dependent extra
; air-acceleration steps above 33 FPS. Clamped to the supported range at startup.
SimulationTimeStep = 0.0303

; Disables ragdolling from falls, passing out, death and the ragdoll key.
; Sleep, death and other gameplay effects still occur normally.
DisableRagdoll = false

; Prevents non-lethal fall damage from forcing the player to crouch and lose
; momentum. Fall damage and landing sounds are unchanged.
DisableFallDamageCrouch = true
; Honour the game's own "I'm too tired" rule. 
RespectExhaustion = true