; ============================================================================
; PBMovement.ini - runtime tunables for the Project Borealis movement graft.
;
; This file lives next to main.dll (.../Moddy-PBMovement/dlls/). Edit a value and
; relaunch the game - no rebuild needed. Anything you delete or leave out falls
; back to the PB-authentic default shown in the comment. Values are read once at
; startup and applied to each player as it spawns.
;
; Units: speeds/accel are Unreal units/sec (HL2-scale; ~100 UU = 1 m). Section
; headers are cosmetic - keys are matched by name, case-insensitively. ';' or '#'
; starts a comment.
; ============================================================================

[General]
; Master switch. false = read-only (no vtable swap, no bytecode patch) - vanilla
; VotV movement. Useful for A/B testing without uninstalling the mod.
EnableGraft = true

[Speeds]
RunSpeed             = 361.9     ; default walk/run speed (MaxWalkSpeed)
SprintSpeed          = 609.6     ; speed while VotV's run input is held
WalkSpeed            = 285.75    ; slow-walk speed
CrouchSpeedFraction  = 0.3333333 ; crouched speed = RunSpeed * this

[Acceleration]
MaxAcceleration               = 857.25 ; CMC ground accel cap
GroundAccelerationMultiplier  = 10.0   ; HL2 ground accel scale
AirAccelerationMultiplier     = 10.0   ; HL2 air-strafe accel scale
AirSpeedCap                   = 57.15  ; per-tick added air speed cap (sv_airaccelerate feel)
AirSlideSpeedCap              = 57.15  ; cap while air-sliding
AirControl                    = 1.0    ; full air control (PB disables UE's low-speed boost)

[Jump]
JumpZVelocity = 304.8   ; jump impulse
AutoBunnyhop  = true    ; hold jump to auto-rejump on landing (keeps momentum)

[Braking]
BrakingFriction            = 4.0    ; PB constant braking-friction base
BrakingFrictionFactor      = 1.0
BrakingDecelerationWalking = 190.5  ; ground stop deceleration
BrakingWindow              = 0.015  ; momentum-preserving window across a hop (s)

[EdgeFriction]
; HL §4.2.1: multiply braking friction near a ledge so you don't slide off. https://www.jwchong.com/hl/movement.html
; Set EdgeFrictionMultiplier = 1.0 to disable entirely (skips the world trace).
EdgeFrictionMultiplier      = 2.0
EdgeFrictionHeight          = 64.77 ; probe depth below the feet
EdgeFrictionDist            = 30.48 ; look-ahead distance
EdgeFrictionOnlyWhenBraking = false ; false = always check (gate open)

[Surf]
; IsValidLandingSpot override: when falling onto a ramp at >= SurfEntrySpeed (3D,
; so a plunge counts) whose surface is steeper than SurfEntryMaxNormalZ, reject
; the engine's landing so you surf instead of snapping to walking.
; Lower SurfEntrySpeed → milder approaches stick (but mild step-downs may surf).
; Raise SurfEntryMaxNormalZ toward 1.0 → surf shallower ramps (0.9 ≈ 26°).
SurfEntrySpeed      = 361.9
SurfEntryMaxNormalZ = 0.9
BounceMultiplier    = 0.0   ; extra slope-bounce on surf clip (0 = none)

[Slope]
; High-speed slope handling: above the speed band the walkable-floor requirement
; tightens and step height shrinks so you ride curved/quarter-pipe ramps.
MinStepHeight          = 10.0
StepDownHeightFraction = 0.9
SpeedMultMin           = 1036.32 ; band low edge  (609.6 * 1.7)
SpeedMultMax           = 1524.0  ; band high edge (609.6 * 2.5)

[Misc]
AxisSpeedLimit = 6667.5  ; PB per-axis velocity clamp
